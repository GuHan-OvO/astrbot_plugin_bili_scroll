name: astrbot_plugin_bili_scroll
display_name: 我会自己刷B站
short_desc: 我会自己刷B站 + 真 @ 主人 + 兴趣画像 + 联动陪伴插件
desc: >-
  她自己的 B站 日常：每天自己刷、挑出值得看的，看完在评论区 @ 你——带 at 映射，不是纯文本提醒。
  还会点赞投币、私信分享、发动态、看番、直播弹幕互动；挑片历史做成可视化页面，
  可按分数、心情、来源筛选；兴趣画像可手改、也可从人设让模型总结，用来影响挑片。
  可与陪伴插件联动：用她的人设和通道发推荐（需陪伴 7.0.0+）。评论回复、语义记忆、好感度、周总结一应俱全。
